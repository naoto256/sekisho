[book]
title = "Sekisho IAP"
description = "Documentation for Sekisho, a Rust-based identity-aware proxy."
authors = ["Naoto Morishima"]
language = "en"
src = "src"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/naoto256/sekisho"
edit-url-template = "https://github.com/naoto256/sekisho/edit/main/docs/{path}"
no-section-label = false

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
