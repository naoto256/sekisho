# `cargo deny` configuration for this crate.
#
# Run `cargo deny check` to exercise advisories, licenses, and source
# checks in one pass.

[advisories]
version = 2
ignore = []

[licenses]
version = 2

# Permissive-only allowlist. acme-core ships under MIT OR Apache-2.0,
# so we accept transitive deps that resolve to a SPDX-compatible
# permissive license. For OR expressions cargo-deny picks the first
# allowed license, so listing only the permissive choices is sufficient
# to keep LGPL-paired deps resolving to the non-copyleft side.
#
# List is trimmed to the licenses actually encountered in the current
# dependency graph so `cargo deny check licenses` runs warning-free
# under the push-gate rust scope. Add a license here only when a new
# dep introduces it.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
# Multiple versions of the same crate are tolerated. The dep graph here
# is small; tracking dup versions is more noise than value.
multiple-versions = "allow"
