[package]
name = "envelope-aead"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Envelope encryption primitives: KEK-wrapped DEK ring + XChaCha20-Poly1305 AEAD blobs, for at-rest secret storage."
publish = false

[lib]
name = "envelope_aead"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
hex = "0.4"
rand = "0.9"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
