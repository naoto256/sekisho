# `cargo deny` configuration for the workspace.
#
# Run `cargo deny check` to exercise advisories, licenses, and source checks
# in one pass. The advisory ignore list below is mirrored verbatim in
# `.cargo/audit.toml` for the `rustsec/audit-check@v2` CI job, which cannot
# read this file. Keep the two lists in lockstep — when adding or removing
# an ignore, update both files in the same commit.

[advisories]
version = 2

# Each ignore below MUST carry a justification. If a better alternative
# becomes available the entry here is the prompt to drop it.
ignore = [
    # RUSTSEC-2024-0370 — `proc-macro-error` unmaintained. Pulled in by
    # `maud_macros` 0.26. Compile-time only; no runtime surface. Drops when
    # maud 0.27 ships.
    { id = "RUSTSEC-2024-0370", reason = "compile-time-only dep via maud_macros; no runtime surface" },

    # RUSTSEC-2025-0134 — `rustls-pemfile` unmaintained (no published
    # vulnerability). Used by sekisho-webui for cert/key PEM parsing at
    # startup only. Drops when rustls 0.24 ships with the integrated
    # parser in `rustls-pki-types`.
    { id = "RUSTSEC-2025-0134", reason = "unmaintained, startup-only cert parsing; pending rustls 0.24" },
]

[licenses]
version = 2

# Permissive-only allowlist. sekisho itself ships under MIT OR Apache-2.0,
# so we accept transitive deps that resolve to a SPDX-compatible permissive
# license. For OR expressions cargo-deny picks the first allowed license,
# so listing only the permissive choices is sufficient to keep LGPL-paired
# deps (e.g. `MIT OR Apache-2.0 OR LGPL-2.1-or-later`) resolving to the
# non-copyleft side.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
