[package]
name = "sekishod"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Identity-Aware Proxy (Sekisho daemon)"

[[bin]]
name = "sekishod"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
sekisho-api-protocol = { path = "../sekisho-api-protocol" }
sekisho-management-rpk-tls = { path = "../sekisho-management-rpk-tls" }
auth-idp = { path = "../../vendor/auth-idp" }
acme-core = { path = "../../vendor/acme-core" }
envelope-aead = { path = "../../vendor/envelope-aead" }
hostname = "0.4"
cookie = { version = "0.18", features = ["signed", "percent-encode"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full", "tokio"] }
rand = "0.9"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
reqwest = { version = "0.13", default-features = false, features = ["rustls-native-certs", "rustls", "json", "form", "http2", "stream"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
quick-xml = { version = "0.41", features = ["serialize"] }
flate2 = "1"
rcgen = "0.13"
regex = "1"
ipnet = "2"
ring = "0.17"
rustls = "0.23.45"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "chrono", "uuid", "derive", "tls-rustls"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
urlencoding = "2"
x509-parser = "0.16"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
hex = "0.4"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
