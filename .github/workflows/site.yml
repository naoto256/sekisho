name: Site

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "site/**"
      - "docs/src/**"
      - "docs/book.toml"
      - ".github/workflows/site.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # pin-audit:2026-10-02 d23441a | v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # pin-audit:2026-09-06 2499707 | v6.5.0
        with:
          node-version-file: site/.node-version
          package-manager-cache: false

      - run: node --version && npm --version

      - run: npm ci --ignore-scripts
        working-directory: site

      # Build first: check:links reads dist/. The unit tests read the
      # source, so their position is a matter of failing on the cheapest
      # and most specific check before the whole-site sweep.
      - run: npm run build && npm run check:unit && npm run check:links && npm run format:check
        working-directory: site

      # /docs/ is rendered by Eleventy from docs/src, not mounted from
      # mdBook's output, so a reader keeps the site's chrome all the way in.
      # docs/book.toml still builds locally; the site just does not consume it.
      - name: Check the book is present under /docs/
        run: |
          set -euo pipefail
          test -f site/dist/docs/index.html
          test -f site/dist/docs/configuration/routes.html
          test -d site/dist/docs/assets

      - name: Record artifact and source identity
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          find site/dist -type f -print0 | sort -z | xargs -0 sha256sum

      - name: Upload verified Pages artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # pin-audit:2026-09-06 fc324d3 | v5.0.0
        with:
          path: site/dist

  deploy:
    # Deployment is manual and main-only. A merge does not publish; someone
    # has to dispatch the workflow, which keeps the published site an
    # explicit act rather than a side effect of landing a branch.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # pin-audit:2026-10-02 cd2ce8f | v5.0.0
